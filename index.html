<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRNG:R Optimizer</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body style="background-image: url('about:blank');background-size: contain; background-repeat: no-repeat; background-position: center;">
    
    <div style="display: flex; justify-content: flex-end;">
        <button id="cat">Cat</button>
    </div>
    <h1>Tycoon RNG: Refinery Optimizer</h1>
    <p>Contact @Elie07 on discord if you have any questions or issues.</p>
    <a href="picker.html">Pick your buildings and generate a .txt file</a>


    <hr>

    <div class="input-section" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">    
        <div class="input-group" style="display: flex; flex-direction: column;">
            <label for="available-buildings">Available buildings:</label>
            <input type="file" id="available-buildings" accept=".txt,text/plain" required>
            <label for="available-buildings-type" style="margin-top: 10px;">Or type them in:</label>
            <textarea id="available-buildings-type" placeholder="Enter buildings, one per line" style="height: 200px;"></textarea>
        </div>
        
        <div class="input-group" style="display: flex; flex-direction: column;">
            <label for="dropper-count">Dropper amount (default level 12 factory):</label>
            <input type="number" id="dropper-count" placeholder="Enter dropper count">
        </div>
        
        <div class="input-group" style="display: flex; flex-direction: column;">
            <label for="upgrader-count">Upgrader count (default level 12 factory):</label>
            <input type="number" id="upgrader-count" placeholder="Enter upgrader count">
        </div>
        
        <div class="input-group" style="display: flex; flex-direction: column;">
            <label for="runs">Runs (default 5):</label>
            <input type="number" id="runs" placeholder="Enter number of runs">
        </div>
        
        <p id="error-message" style="color: red;"></p>
        <button id="run-button">Run Optimization</button>
    </div>

    <hr>

    <div style="margin-top: 20px;">
        <h2>Optimized Factory:</h2>
        <h3>$/sec:</h3>
        <p id="value">...</p>
        <h3>Droppers:</h3>
        <p id="droppers">...</p>
        <h3>Upgraders:</h3>
        <p id="upgraders">...</p>
        <h3>Processor:</h3>
        <p id="processor">...</p>
    </div>

    <script>
        const images = [
            'https://media.discordapp.net/attachments/1512496858709102762/1552376950880731306/064CDC86-7D90-438B-ADA9-F4B855F109B2.jpg?ex=6ab56332&is=6ab411b2&hm=ea627d2cb01c38bf54736aad931b36bf2c5e8f6d8ce008214c7499065154d6ee&=&format=webp&width=960&height=1280',
            'https://media.discordapp.net/attachments/1512496858709102762/1552375987499442317/IMG_2600.jpg?ex=6ab5624d&is=6ab410cd&hm=fa7c57ea00b3422a5e345d28c6e5f9a48e3b64ad735d8c2c806c1edb8118daea&=&format=webp&width=959&height=1280',
            'https://media.discordapp.net/attachments/1512496858709102762/1552375988980162732/IMG_2577.jpg?ex=6ab5624d&is=6ab410cd&hm=4fb2508b274d26a8e19c3de526c50f09d9c33c99e39d47f9a464c59df75a5236&=&format=webp&width=1536&height=1244',
        ];
        let currentIndex = 0;
        const button = document.getElementById('cat');

        button.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            document.body.style.backgroundImage = `url('${images[currentIndex]}')`;
        });
    </script>


    <script type="py" src="./src/rngoptimizer/web.py"
    config='{
    "files": {
            "./src/rngoptimizer/engine.py": "./engine.py",
            "./src/rngoptimizer/definitions.py": "./definitions.py",
            "./src/rngoptimizer/buildings.py": "./buildings.py"
    }
  }'></script>

</body>
</html>
